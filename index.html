<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gravity Falls — Archivo de Investigación</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, serif;
            background:
                linear-gradient(rgba(10, 15, 10, 0.65), rgba(5, 10, 5, 0.85)),
                url("https://images.unsplash.com/photo-1448375240586-882707db888b")
                center / cover fixed;
            color: #e8dfc4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .contenedor {
            width: 90%;
            max-width: 900px;
            padding: 60px 30px;
            border: 1px solid rgba(220, 205, 160, 0.35);
            background: rgba(15, 20, 13, 0.75);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(3px);
        }

        .clasificado {
            font-size: 13px;
            letter-spacing: 5px;
            color: #b9aa7c;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(45px, 9vw, 90px);
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .subtitulo {
            font-size: 18px;
            letter-spacing: 4px;
            color: #b9aa7c;
            margin-bottom: 35px;
        }

        .frase {
            font-style: italic;
            font-size: 20px;
            margin-bottom: 45px;
            color: #d6cfb9;
        }

        .boton {
            display: inline-block;
            padding: 15px 35px;
            border: 1px solid #b9aa7c;
            color: #e8dfc4;
            text-decoration: none;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .boton:hover {
            background: #b9aa7c;
            color: #10130d;
            box-shadow: 0 0 25px rgba(185, 170, 124, 0.35);
        }

        .advertencia {
            margin-top: 45px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #817b68;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <div class="clasificado">
            ARCHIVO CLASIFICADO
        </div>

        <h1>GRAVITY FALLS</h1>

        <div class="subtitulo">
            ARCHIVO DE INVESTIGACIÓN
        </div>

        <p class="frase">
            "No todo es lo que parece..."
        </p>

<a href="archivo.html" class="boton">
    ENTRAR AL ARCHIVO
</a>

        <div class="advertencia">
            ⚠ INFORMACIÓN RESTRINGIDA ⚠
        </div>

    </main>

</body>
</html>
